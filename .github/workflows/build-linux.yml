name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: "CUDA ${{ matrix.cuda }} / ${{ matrix.label }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cuda: "13.2.0"
            label: "Linux-GCC"
            generator: "Ninja"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install CUDA Toolkit ${{ matrix.cuda }}
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          use-github-cache: true

      # Pin Python so that both pip and CMake's find_package(Python) use the same.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install numpy

      - name: Show tool versions
        shell: bash
        run: |
          cmake --version | head -1
          nvcc --version

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -G "${{ matrix.generator }}" ${{ matrix.cmake_config_args || '' }} `
            -DMATX_BUILD_TESTS=ON `
            -DMATX_BUILD_EXAMPLES=ON `
            -DMATX_BUILD_BENCHMARKS=OFF `
            -DMATX_BUILD_DOCS=OFF `
            -DCMAKE_CUDA_ARCHITECTURES="80"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.label }}-cuda${{ matrix.cuda }}
          path: |
            build/**/*.log
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/*.log
          retention-days: 7
